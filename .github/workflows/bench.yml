# The representative-task benchmark (bench/README.md): each task is a job a Solid user does with a library of the
# ecosystem — its good program accepted by both checkers, typed by the library's own types and run in Chromium, its
# one-line mistakes refused. The run is compared with bench/scorecard.json: a check that is green there may not turn
# red, and a check that is red is one its task's `known` gives the reason for. And the coverage suite: every package of
# the libraries bench/coverage/libraries.json lists, drafted whole and used once, compared with bench/coverage/coverage.json.
#
# The tasks on one machine, several at once (BENCH_JOBS), and the coverage suite over three. `--shard i/3` is every third entry and every
# third module no entry drafts; each shard holds the whole list (bench/coverage.mjs).
name: bench

on:
  push:
    branches: [main]
    paths: ["compiler/**", "ref/**", "runtime/**", "tooling/rx-language-server/**", "bench/**", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["compiler/**", "ref/**", "runtime/**", "tooling/rx-language-server/**", "bench/**", ".github/workflows/bench.yml"]
  workflow_dispatch:

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: tasks, run: "--tasks-only" }
          - { name: coverage 1/3, run: "--coverage-only --shard 1/3" }
          - { name: coverage 2/3, run: "--coverage-only --shard 2/3" }
          - { name: coverage 3/3, run: "--coverage-only --shard 3/3" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The crate (rxc, and the Node-API build Solid's Vite plugin loads)
        working-directory: compiler
        run: |
          npm ci
          cargo build --release
          npx napi build --platform --release --features node --manifest-path ./Cargo.toml -- --lib
      - name: The runtime
        run: npm --prefix runtime ci && npm --prefix runtime run build
      - name: The language server's packages (rx-tsc)
        run: npm --prefix tooling/rx-language-server ci
      - name: The libraries, and Chromium
        run: |
          # from the lockfile, as bench/harness.mjs installs them: every machine resolves the same tree
          mkdir -p bench/.out/ws && cp bench/package.json bench/package-lock.json bench/.out/ws/
          (cd bench/.out/ws && npm ci --no-audit --no-fund --legacy-peer-deps && cp package-lock.json node_modules/.installed-from-lock && npx playwright install --with-deps chromium)
      - name: The benchmark's own counting
        run: RXC=$GITHUB_WORKSPACE/compiler/target/release/rxc node bench/measure.test.mjs
      - name: The benchmark, against bench/scorecard.json and bench/coverage/coverage.json
        env:
          BENCH_JOBS: 4   # the machine is this job's alone: every core (by default, half)
        run: node bench/run.mjs ${{ matrix.run }} --check --strict
