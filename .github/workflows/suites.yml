# The suites CONTRIBUTING.md lists ("Running the suite"), on every change to what they read: the crate's own tests, the
# reference implementation's (ref/: the interpreter over every scenario, the same scenarios lowered onto Solid, the
# compiled modules, streamed SSR and hydration in Chromium, the TSX projection), the crate against ref/ in each of its
# modes (CP-5: checked, client-only, whole-program, lowered, projected), and the three suites that run a guarantee
# rather than a list of cases (compiler/test/confined.mjs, drafts.mjs), with what an app must install to run at all
# (compiler/test/runtime-resolve.mjs).
#
# ref/ runs on Solid built from source at ref/SOLID_NEXT (ref/scripts/solid-next.sh: pnpm, and a Rust build of Solid's
# native compiler). That build is kept in a cache keyed by the pin, so it is made once per pin and restored after
# (.github/actions/solid-next; editor.yml's job reads the same one).
#
# ref/'s runners are one job, not several: with Solid restored and the SSR scenarios run by several processes it is about
# four minutes, half of them the setup each job of a split would do again (Solid, the crate, Chromium, the runtime).
name: suites

on:
  push:
    branches: [main]
    paths: ["compiler/**", "ref/**", "runtime/**", "scenarios/**", "examples/**", "bench/**", "spec/**", "scripts/**", "guide/**", ".github/workflows/suites.yml", ".github/actions/solid-next/**"]
  pull_request:
    paths: ["compiler/**", "ref/**", "runtime/**", "scenarios/**", "examples/**", "bench/**", "spec/**", "scripts/**", "guide/**", ".github/workflows/suites.yml", ".github/actions/solid-next/**"]
  workflow_dispatch:

jobs:
  # the crate's own tests (compiler/src's units, compiler/tests/)
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: test
      - name: cargo test
        working-directory: compiler
        run: cargo test --release

  # ref/'s runners, and the crate against ref/
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1   # solid-next's packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Solid next, at the pin
        uses: ./.github/actions/solid-next
      - name: ref/ (links ../solid-next), and Chromium
        run: |
          npm --prefix ref install
          (cd ref && npx playwright install --with-deps chromium)
      - name: The crate (rxc, and the Node-API build)
        working-directory: compiler
        run: |
          npm ci
          cargo build --release
          npx napi build --platform --release --features node --manifest-path ./Cargo.toml -- --lib
      - name: The runtime
        run: npm --prefix runtime ci && npm --prefix runtime run build
      - name: "the runtime as built: both builds, the request's and the render's state, and Solid's contract (the installed release and the pin)"
        working-directory: runtime
        run: SOLID_NEXT="${{ github.workspace }}/../solid-next" node test.mjs
      - name: "spec: every rule and diagnostic that is named is in it"
        run: node scripts/spec-refs.mjs
      - name: "ref: the interpreter over every scenario"
        working-directory: ref
        run: npm test
      - name: "ref: the scenarios lowered onto Solid (the oracle)"
        working-directory: ref
        run: npm run oracle
      - name: "ref: compiled modules"
        working-directory: ref
        run: npm run compiled
      - name: "ref: streamed SSR and hydration in Chromium"
        working-directory: ref
        run: RX_JOBS=4 npm run ssr   # it waits more than it works
      - name: The language server's packages (the checker ref's types are asked of, and rx-tsc)
        run: npm --prefix tooling/rx-language-server ci
      - name: "ref: the TSX projection, checked by the tooling's checker (tsrs, TypeScript 7)"
        working-directory: ref
        run: npm run types
      - name: "crate against ref/: checked, client-only (--spa), the whole program (--whole-program), lowered (--lower), projected (--project)"
        working-directory: ref
        run: RX_JOBS=4 node ../scripts/parallel.mjs "npm run -s crate" "npm run -s crate -- --spa" "npm run -s crate -- --whole-program" "npm run -s crate -- --lower" "npm run -s crate -- --project"
      - name: "the guarantees, run: drafts (MO-10i)"
        run: node compiler/test/drafts.mjs
      - name: "the library build: a package written in .rx (MO-13e)"
        run: node compiler/test/lib.mjs
      - name: The libraries confined.mjs runs against (bench/package.json)
        run: |
          # from the lockfile, as bench/harness.mjs installs them: every machine resolves the same tree
          mkdir -p bench/.out/ws && cp bench/package.json bench/package-lock.json bench/.out/ws/
          (cd bench/.out/ws && npm ci --no-audit --no-fund --legacy-peer-deps && cp package-lock.json node_modules/.installed-from-lock)
      - name: "the guarantees, run: the counterexamples and their controls, in Chromium (CN-7)"
        run: node compiler/test/confined.mjs
      - name: "an app that lists only the compiler: the runtime nested, hoisted, and listed nowhere, under start mode's dev server and its build (CP-4a)"
        run: node compiler/test/runtime-resolve.mjs
